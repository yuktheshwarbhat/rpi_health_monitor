<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPi Health Monitor</title>
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dashboard {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .full-width {
            grid-column: 1 / -1; /* Makes the chart span both columns */
        }
        h2 { margin-top: 0; color: #bb86fc; font-size: 1.2rem; }
        .value { font-size: 2.5rem; font-weight: bold; margin: 10px 0; }
        .temp-normal { color: #03dac6; }
        .temp-warm { color: #ffb74d; }
        .temp-hot { color: #cf6679; }
        
        /* Chart container */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>🍓 Raspberry Pi Health Monitor</h1>

    <div class="dashboard">
        <!-- Current Temp Card -->
        <div class="card">
            <h2>CPU Temperature</h2>
            <div id="currentTemp" class="value temp-normal">-- °C</div>
        </div>

        <!-- CPU Usage Card -->
        <div class="card">
            <h2>CPU Usage</h2>
            <div id="cpuUsage" class="value" style="color: #03dac6;">-- %</div>
        </div>

        <!-- Historical Graph Card -->
        <div class="card full-width">
            <h2>Temperature History (Last 60 Readings)</h2>
            <div class="chart-container">
                <canvas id="tempChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Initialize Chart.js
        const ctx = document.getElementById('tempChart').getContext('2d');
        
        const chartConfig = {
            type: 'line',
            data: {
                labels: [], // Timestamps will go here
                datasets: [{
                    label: 'CPU Temp (°C)',
                    data: [], // Temperature values will go here
                    borderColor: '#bb86fc',
                    backgroundColor: 'rgba(187, 134, 252, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4, // Makes the line smooth and curvy
                    pointRadius: 0 // Hides the dots on the line
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: false,
                        grid: { color: '#333' },
                        ticks: { color: '#e0e0e0' }
                    },
                    x: {
                        grid: { color: '#333' },
                        ticks: { 
                            color: '#e0e0e0',
                            maxTicksLimit: 8 // Prevents time labels from overlapping
                        }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        };

        const myChart = new Chart(ctx, chartConfig);

        // Function to fetch data and update UI
        async function refreshData() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                // 1. Update Current Temp
                const tempEl = document.getElementById('currentTemp');
                tempEl.innerText = `${data.cpu_temp.toFixed(1)} °C`;
                
                // Change color based on heat
                tempEl.className = 'value';
                if (data.cpu_temp < 55) tempEl.classList.add('temp-normal');
                else if (data.cpu_temp < 70) tempEl.classList.add('temp-warm');
                else tempEl.classList.add('temp-hot');

                // 2. Update CPU Usage
                document.getElementById('cpuUsage').innerText = `${data.cpu_usage.toFixed(1)} %`;

                // 3. Update Chart
                const labels = data.history.map(point => {
                    // Convert Unix timestamp to HH:MM:SS format
                    return new Date(point.time * 1000).toLocaleTimeString();
                });
                const temps = data.history.map(point => point.temp);

                myChart.data.labels = labels;
                myChart.data.datasets[0].data = temps;
                myChart.update('none'); // 'none' prevents animation lag on every update

            } catch (error) {
                console.error("Failed to fetch stats:", error);
            }
        }

        // Fetch immediately on load, then every 1 seconds
        refreshData();
        setInterval(refreshData, 1000);
    </script>
</body>
</html>
